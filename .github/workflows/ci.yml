name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# PR은 PR 번호로 묶어 이전 실행을 취소하고, main push는 커밋마다 끝까지 실행한다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # @SpringBootTest(BackendApplicationTests, SearchServiceIntegrationTest)가
    # application.yaml의 jdbc:mysql://localhost:3306/uninote_db 에 접속한다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: uninote_db
          MYSQL_USER: uninote_ci
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # CI 전용 가짜 값. 실제 비밀값이 아니다.
    env:
      DB_USERNAME: uninote_ci
      DB_PASSWORD: ci_test_password
      JWT_SECRET: ci-only-fake-jwt-secret-at-least-32-bytes-long-0000
      JWT_EXPIRATION: "86400000"
      # GeminiClient @PostConstruct가 빈 키면 컨텍스트 기동을 막는다. 테스트는 Gemini를 호출하지 않는다.
      GEMINI_API_KEY: ci-only-fake-gemini-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # gradlew가 실행 권한 없이(100644) 커밋되어 있어 러너에서만 권한을 준다.
      - run: chmod +x gradlew

      - run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # vitest 5가 Node ^22.12 || ^24 를 요구한다. 로컬 개발 환경은 Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    name: Backend image (GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # GHCR 이름은 소문자여야 해서 github.repository_owner(Jung-DaeYoung)를 쓰지 않는다.
      IMAGE: ghcr.io/jung-daeyoung/uni-note-backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context를 로컬 경로로 지정해야 backend/.dockerignore가 적용된다.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

  deploy:
    name: Deploy backend (SSM)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GITHUB_TOKEN을 쓰지 않는다.
    permissions: {}
    # 워크플로 concurrency는 SHA별이라 main push가 연달아 오면 배포가 겹칠 수 있다. 진행 중인 배포는 취소하지 않는다.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-2
      INSTANCE_ID: i-0bf5c3061e672a073

    steps:
      # EC2의 /opt/uninote/deploy.sh <ImageTag>를 실행한다. 공개 저장소라 SSM 결과는 Status와 ResponseCode만 출력한다.
      # aws ssm wait command-executed는 약 100초만 기다려서 쓰지 않고, 10초 간격으로 최대 15분 폴링한다.
      - name: Run UniNote-Deploy
        run: |
          cmd_id=$(aws ssm send-command \
            --document-name UniNote-Deploy \
            --instance-ids "$INSTANCE_ID" \
            --timeout-seconds 120 \
            --parameters "{\"ImageTag\":[\"$GITHUB_SHA\"]}" \
            --query Command.CommandId --output text)
          echo "CommandId: $cmd_id, ImageTag: $GITHUB_SHA"

          status=Pending
          for i in $(seq 1 90); do
            sleep 10
            if ! out=$(aws ssm get-command-invocation --command-id "$cmd_id" \
                --instance-id "$INSTANCE_ID" --query Status --output text 2>&1); then
              # 명령 직후에는 invocation이 아직 없을 수 있다.
              case "$out" in *InvocationDoesNotExist*) continue ;; esac
              echo "$out" >&2
              exit 1
            fi
            status=$out
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[Status,ResponseCode]' --output text || true
          if [ "$status" != "Success" ]; then
            echo "::error::SSM deploy did not succeed (status: $status)"
            exit 1
          fi
