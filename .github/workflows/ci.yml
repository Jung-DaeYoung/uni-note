name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # @SpringBootTest(BackendApplicationTests, SearchServiceIntegrationTest)가
    # application.yaml의 jdbc:mysql://localhost:3306/uninote_db 에 접속한다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: uninote_db
          MYSQL_USER: uninote_ci
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # CI 전용 가짜 값. 실제 비밀값이 아니다.
    env:
      DB_USERNAME: uninote_ci
      DB_PASSWORD: ci_test_password
      JWT_SECRET: ci-only-fake-jwt-secret-at-least-32-bytes-long-0000
      JWT_EXPIRATION: "86400000"
      # GeminiClient @PostConstruct가 빈 키면 컨텍스트 기동을 막는다. 테스트는 Gemini를 호출하지 않는다.
      GEMINI_API_KEY: ci-only-fake-gemini-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # gradlew가 실행 권한 없이(100644) 커밋되어 있어 러너에서만 권한을 준다.
      - run: chmod +x gradlew

      - run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # vitest 5가 Node ^22.12 || ^24 를 요구한다. 로컬 개발 환경은 Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
