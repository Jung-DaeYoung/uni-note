<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      XSS로 인한 localStorage JWT 탈취 위험을 낮추기 위한 최소한의 CSP.
      백엔드 origin(현재 http://localhost:8080)이 바뀌면 connect-src/img-src도 함께 갱신해야 한다.
      style-src에 unsafe-inline이 필요한 이유: NotionEditor.jsx가 <style> 태그를 인라인으로 사용한다.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost:8080; connect-src 'self' http://localhost:8080; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
